<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Discord Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0014;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .test-btn {
            background: #5865F2;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
            width: 100%;
        }

        .test-btn:hover {
            background: #4752C4;
        }

        .log {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
        }

        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #5865F2;
            padding-left: 10px;
        }

        /* Modal Styles */
        .discord-login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5000;
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a0a2e 0%, #2d0a47 100%);
            border: 2px solid #9d4edd;
            border-radius: 20px;
            padding: 50px;
            width: 90%;
            max-width: 500px;
            z-index: 5001;
            box-shadow: 0 20px 60px rgba(157, 78, 221, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header i {
            font-size: 48px;
            color: #5865F2;
            margin-bottom: 15px;
            display: block;
        }

        .login-header h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .discord-login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #5865F2;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .discord-login-btn:hover {
            background: #4752C4;
        }

        .profile-section {
            text-align: center;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #9d4edd;
            object-fit: cover;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Teste do Login Discord</h1>
        <p>Use os botões abaixo para testar a funcionalidade do login Discord</p>

        <button class="test-btn" onclick="testOpenModal()">
            <i class="fab fa-discord"></i> Abrir Modal
        </button>

        <button class="test-btn" onclick="testCloseModal()">
            <i class="fas fa-times"></i> Fechar Modal
        </button>

        <button class="test-btn" onclick="testLocalStorage()">
            <i class="fas fa-database"></i> Verificar LocalStorage
        </button>

        <button class="test-btn" onclick="testSimulateLogin()">
            <i class="fas fa-check"></i> Simular Login
        </button>

        <button class="test-btn" onclick="testClearStorage()">
            <i class="fas fa-trash"></i> Limpar LocalStorage
        </button>

        <div class="log" id="log">
            <div class="log-entry">Console iniciado...</div>
        </div>
    </div>

    <!-- Discord Login Modal -->
    <div id="discord-login" class="discord-login-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="testCloseModal()">
                <i class="fas fa-times"></i>
            </button>

            <div id="login-area" class="login-section">
                <div class="login-header">
                    <i class="fab fa-discord"></i>
                    <h2>Bem-vindo ao VEditor!</h2>
                    <p>Faça login com sua conta Discord para continuar</p>
                </div>

                <a href="https://discord.com/oauth2/authorize?client_id=1506175869687828500&response_type=token&redirect_uri=https%3A%2F%2Fvetscy.github.io%2FVEditor%2F&scope=identify" class="discord-login-btn">
                    <i class="fab fa-discord"></i>
                    <span>Entrar com Discord</span>
                </a>
            </div>

            <div id="profile-area" class="profile-section" style="display: none;">
                <img id="avatar" src="" alt="Avatar" class="profile-avatar">
                <h2>Bem-vindo, <span id="username"></span>!</h2>
                <p id="user-id"></p>
            </div>
        </div>
    </div>

    <script>
        const log = document.getElementById('log');

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
            console.log(message);
        }

        function testOpenModal() {
            addLog('📂 Abrindo modal...', 'info');
            const modal = document.getElementById('discord-login');
            if (modal) {
                modal.style.display = 'block';
                addLog('✅ Modal aberto com sucesso!', 'success');
            } else {
                addLog('❌ Modal não encontrado!', 'error');
            }
        }

        function testCloseModal() {
            addLog('📁 Fechando modal...', 'info');
            const modal = document.getElementById('discord-login');
            if (modal) {
                modal.style.display = 'none';
                addLog('✅ Modal fechado com sucesso!', 'success');
            }
        }

        function testLocalStorage() {
            addLog('🔍 Verificando LocalStorage...', 'info');
            const token = localStorage.getItem('discord_access_token');
            const user = localStorage.getItem('discord_user');
            
            if (token) {
                addLog('✅ Token encontrado: ' + token.substring(0, 20) + '...', 'success');
            } else {
                addLog('⚠️ Nenhum token encontrado', 'warning');
            }

            if (user) {
                const userData = JSON.parse(user);
                addLog(`✅ Usuário: ${userData.username} (ID: ${userData.id})`, 'success');
            } else {
                addLog('⚠️ Nenhum usuário encontrado', 'warning');
            }
        }

        function testSimulateLogin() {
            addLog('🎭 Simulando login...', 'info');
            
            const mockUser = {
                id: '123456789',
                username: 'TestUser',
                avatar: null
            };

            localStorage.setItem('discord_access_token', 'mock_token_12345');
            localStorage.setItem('discord_user', JSON.stringify(mockUser));
            
            addLog(`✅ Login simulado: ${mockUser.username}`, 'success');
            
            // Mostrar profile area
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('profile-area').style.display = 'block';
            document.getElementById('username').textContent = mockUser.username;
            document.getElementById('user-id').textContent = `ID: ${mockUser.id}`;
            
            testOpenModal();
        }

        function testClearStorage() {
            addLog('🗑️ Limpando LocalStorage...', 'info');
            localStorage.removeItem('discord_access_token');
            localStorage.removeItem('discord_token_type');
            localStorage.removeItem('discord_user');
            
            // Resetar modal
            document.getElementById('login-area').style.display = 'block';
            document.getElementById('profile-area').style.display = 'none';
            
            addLog('✅ LocalStorage limpo!', 'success');
        }

        // Log inicial
        window.addEventListener('load', () => {
            addLog('🚀 Página carregada com sucesso!', 'success');
            addLog(`URL: ${window.location.href}`, 'info');
            addLog(`Hash: ${window.location.hash}`, 'info');
        });
    </script>
</body>
</html>
