<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VEditor</title>
    <link rel="icon" href="Nova pasta/iconV.png" type="image/png">
    <link rel="stylesheet" href="login-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="protect.js" defer></script>
</head>
<body>
    <!-- Navegação Flutuante -->
    <nav class="floating-nav">
        <div class="nav-content">
            <a href="home.html" class="nav-logo" title="Home">
                <img src="Nova pasta/iconV.png" alt="V Logo" class="logo-img">
            </a>
            <a href="home.html" class="nav-back" title="Voltar">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>
    </nav>

    <!-- Login Area -->
    <div id="login-area" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-sign-in-alt"></i>
                <h1>Bem-vindo ao VEditor!</h1>
                <p>Faça login com sua conta Discord para continuar</p>
            </div>

            <div class="login-content">
                <a href="https://discord.com/oauth2/authorize?client_id=1506175869687828500&response_type=token&redirect_uri=https%3A%2F%2Fvetscy.github.io%2FVEditor%2Flogin.html&scope=identify" id="login-btn" class="discord-login-btn">
                    <i class="fab fa-discord"></i>
                    <span>Entrar com Discord</span>
                </a>
                
                <div class="login-info">
                    <p>Por que fazer login?</p>
                    <ul>
                        <li><i class="fas fa-check"></i> Acompanhe suas comissões</li>
                        <li><i class="fas fa-check"></i> Acesse seu perfil personalizado</li>
                        <li><i class="fas fa-check"></i> Receba notificações de atualizações</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Area -->
    <div id="profile-area" class="profile-container" style="display: none;">
        <div class="profile-card">
            <div class="profile-header">
                <img id="avatar" src="" alt="Avatar do Discord" class="profile-avatar">
                <div class="profile-info">
                    <h2>Bem-vindo, <span id="username"></span>!</h2>
                    <p id="user-id" class="user-id"></p>
                </div>
            </div>

            <div class="profile-content">
                <div class="profile-actions">
                    <a href="comissoes.html" class="btn btn-gradient">
                        <i class="fas fa-star"></i> Ver Comissões
                    </a>
                    <a href="portfolio.html" class="btn btn-outline">
                        <i class="fas fa-play"></i> Ver Portfólio
                    </a>
                </div>

                <div class="profile-logout">
                    <button id="logout-btn" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="login-script.js"></script>
</body>
</html>
