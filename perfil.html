<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - V Edições e Comissões</title>
    <link rel="icon" href="Nova pasta/iconV.png" type="image/png">
    <link rel="stylesheet" href="home-style.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="protect.js" defer></script>
    <style>
        .profile-header {
            background: linear-gradient(135deg, #1a0a2e 0%, #2d0a47 100%);
            border-bottom: 2px solid #9d4edd;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            align-items: start;
        }

        .profile-sidebar {
            background: rgba(26, 10, 46, 0.6);
            border: 2px solid #9d4edd;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            position: sticky;
            top: 100px;
        }

        .profile-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid #c77dff;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(199, 125, 255, 0.3);
        }

        .profile-username {
            font-size: 28px;
            font-weight: 700;
            color: #c77dff;
            margin-bottom: 10px;
        }

        .profile-discord-id {
            color: #c0c0c0;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .profile-bio {
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(157, 78, 221, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #c77dff;
        }

        .stat-label {
            font-size: 12px;
            color: #c0c0c0;
            margin-top: 5px;
        }

        .follow-btn {
            width: 100%;
            background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .follow-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(157, 78, 221, 0.4);
        }

        .follow-btn.following {
            background: rgba(157, 78, 221, 0.3);
            border: 2px solid #9d4edd;
            color: #c77dff;
        }

        .profile-main {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .section {
            background: rgba(26, 10, 46, 0.6);
            border: 2px solid #9d4edd;
            border-radius: 15px;
            padding: 30px;
        }

        .section h2 {
            color: #c77dff;
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.15) 0%, rgba(199, 125, 255, 0.05) 100%);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: #c77dff;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.25) 0%, rgba(199, 125, 255, 0.15) 100%);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.3);
        }

        .product-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .product-name {
            font-weight: 600;
            color: #c77dff;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 12px;
            color: #c0c0c0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #c0c0c0;
        }

        .empty-state i {
            font-size: 48px;
            color: #9d4edd;
            margin-bottom: 15px;
        }

        .followers-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .follower-card {
            background: rgba(157, 78, 221, 0.1);
            border: 1px solid #9d4edd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .follower-card:hover {
            border-color: #c77dff;
            background: rgba(157, 78, 221, 0.2);
        }

        .follower-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 2px solid #c77dff;
            object-fit: cover;
        }

        .follower-name {
            font-weight: 600;
            color: #c77dff;
            font-size: 13px;
            margin-bottom: 5px;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            .profile-container {
                grid-template-columns: 1fr;
            }

            .profile-sidebar {
                position: static;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #c0c0c0;
        }

        .loading i {
            font-size: 32px;
            color: #c77dff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navegação Flutuante -->
    <nav class="floating-nav">
        <div class="nav-content">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="comissoes.html" class="nav-link"><i class="fas fa-star"></i> Comissões</a>
            <a href="portfolio.html" class="nav-link"><i class="fas fa-images"></i> Portfólio</a>
            <button id="discord-nav-btn" onclick="openDiscordLogin()" class="nav-link">
                <i class="fas fa-discord"></i> Discord
            </button>
            <div id="user-profile-nav" style="display: none; cursor: pointer; align-items: center; gap: 8px;">
                <img id="nav-avatar" src="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
                <span id="nav-username" style="font-size: 12px;">Usuário</span>
            </div>
        </div>
    </nav>

    <!-- Profile Header -->
    <div class="profile-header">
        <div class="profile-container">
            <!-- Sidebar do Perfil -->
            <div class="profile-sidebar">
                <img id="profile-avatar" class="profile-avatar" src="" alt="Avatar">
                <div class="profile-username" id="profile-username">Carregando...</div>
                <div class="profile-discord-id" id="profile-discord-id">ID Discord</div>
                <div class="profile-bio" id="profile-bio"></div>

                <!-- Stats -->
                <div class="profile-stats">
                    <div class="stat">
                        <div class="stat-number" id="total-compras">0</div>
                        <div class="stat-label">Compras</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="total-seguidores">0</div>
                        <div class="stat-label">Seguidores</div>
                    </div>
                </div>

                <!-- Botões -->
                <button id="follow-btn" class="follow-btn" style="display: none;" onclick="toggleFollow()">
                    <i class="fas fa-plus"></i> Seguir
                </button>
            </div>

            <!-- Main Content -->
            <div class="profile-main">
                <!-- Produtos -->
                <div class="section">
                    <h2><i class="fas fa-shopping-bag"></i> Produtos Comprados</h2>
                    <div id="products-container" class="products-grid">
                        <div class="loading">
                            <i class="fas fa-spinner"></i><br>
                            Carregando produtos...
                        </div>
                    </div>
                </div>

                <!-- Seguidores -->
                <div class="section">
                    <h2><i class="fas fa-users"></i> Seguidores</h2>
                    <div id="followers-container" class="followers-list">
                        <div class="loading">
                            <i class="fas fa-spinner"></i><br>
                            Carregando seguidores...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Discord Login Modal -->
    <div id="discord-login" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeDiscordLogin()">&times;</span>
            <h2>Conectar com Discord</h2>
            <p>Faça login com sua conta Discord para acessar todos os recursos</p>
            <a href="https://discord.com/api/oauth2/authorize?client_id=1289065629449314307&response_type=token&redirect_uri=https://vetscy.github.io/VEditor/&scope=identify+email+guilds" 
               target="_blank" rel="noopener noreferrer" class="btn-discord">
                <i class="fab fa-discord"></i> Entrar com Discord
            </a>
        </div>
    </div>

    <script src="home-script.js"></script>
    <script>
        const SUPABASE_URL = 'https://knbloqfdvlioxxkxthif.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuYmxvcWZkdmxpb3h4a3h0aGlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTIxNTMsImV4cCI6MjA5NDcyODE1M30.wDdPtUEBv8I00j0t-mlmdp3GDEcCZyRe1_BacNsQoCU';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userIdParam = null;
        let currentUserDiscordId = null;

        // Obter ID do Discord da URL
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            userIdParam = params.get('id');

            if (userIdParam) {
                carregarPerfilUsuario(userIdParam);
                carregarProdutosUsuario(userIdParam);
                carregarSeguidores(userIdParam);
            }

            // Verificar se usuário está logado
            const userData = JSON.parse(localStorage.getItem('discord_user') || '{}');
            if (userData.id) {
                currentUserDiscordId = userData.id;
                verificarFollowStatus(userData.id, userIdParam);
                document.getElementById('discord-nav-btn').style.display = 'none';
                document.getElementById('user-profile-nav').style.display = 'flex';
                document.getElementById('nav-avatar').src = `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`;
                document.getElementById('nav-username').textContent = userData.username;
            }
        });

        async function carregarPerfilUsuario(discordId) {
            try {
                const { data: perfil, error } = await supabaseClient
                    .from('perfis')
                    .select('*')
                    .eq('id_discord', discordId)
                    .single();

                if (error) throw error;

                if (perfil) {
                    document.getElementById('profile-avatar').src = perfil.avatar_url || 'https://via.placeholder.com/180';
                    document.getElementById('profile-username').textContent = perfil.username || 'Usuário';
                    document.getElementById('profile-discord-id').textContent = `ID: ${perfil.id_discord}`;
                    document.getElementById('profile-bio').textContent = perfil.bio || '';
                }
            } catch (err) {
                console.error('Erro ao carregar perfil:', err);
            }
        }

        async function carregarProdutosUsuario(discordId) {
            try {
                const { data: produtos, error } = await supabaseClient
                    .from('produtos_usuarios')
                    .select('*')
                    .eq('id_usuario_discord', discordId);

                if (error) throw error;

                const container = document.getElementById('products-container');
                
                if (!produtos || produtos.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>Nenhum produto comprado ainda</p>
                        </div>
                    `;
                    document.getElementById('total-compras').textContent = '0';
                } else {
                    container.innerHTML = '';
                    document.getElementById('total-compras').textContent = produtos.length;

                    produtos.forEach(prod => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="product-icon">📦</div>
                            <div class="product-name">${prod.nome_produto}</div>
                            <div class="product-desc">${prod.descricao || 'Produto'}</div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (err) {
                console.error('Erro ao carregar produtos:', err);
                document.getElementById('products-container').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Erro ao carregar produtos</p>
                    </div>
                `;
            }
        }

        async function carregarSeguidores(discordId) {
            try {
                const { data: followers, error } = await supabaseClient
                    .from('followers')
                    .select('perfis!followers_seguidor_id_fkey(id_discord, username, avatar_url)')
                    .eq('seguindo_id', discordId);

                if (error) throw error;

                const container = document.getElementById('followers-container');

                if (!followers || followers.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <i class="fas fa-user-friends"></i>
                            <p>Sem seguidores ainda</p>
                        </div>
                    `;
                    document.getElementById('total-seguidores').textContent = '0';
                } else {
                    container.innerHTML = '';
                    document.getElementById('total-seguidores').textContent = followers.length;

                    followers.forEach(follow => {
                        const perfil = follow.perfis;
                        const card = document.createElement('div');
                        card.className = 'follower-card';
                        card.style.cursor = 'pointer';
                        card.onclick = () => window.location.href = `perfil.html?id=${perfil.id_discord}`;
                        card.innerHTML = `
                            <img src="${perfil.avatar_url || 'https://via.placeholder.com/60'}" class="follower-avatar">
                            <div class="follower-name">${perfil.username}</div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (err) {
                console.error('Erro ao carregar seguidores:', err);
                document.getElementById('followers-container').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Erro ao carregar seguidores</p>
                    </div>
                `;
            }
        }

        async function verificarFollowStatus(currentUserId, targetUserId) {
            if (!currentUserId || !targetUserId || currentUserId === targetUserId) {
                document.getElementById('follow-btn').style.display = 'none';
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('followers')
                    .select('*')
                    .eq('seguidor_id', currentUserId)
                    .eq('seguindo_id', targetUserId)
                    .single();

                const btn = document.getElementById('follow-btn');
                btn.style.display = 'block';

                if (data) {
                    btn.classList.add('following');
                    btn.innerHTML = '<i class="fas fa-check"></i> Seguindo';
                } else {
                    btn.classList.remove('following');
                    btn.innerHTML = '<i class="fas fa-plus"></i> Seguir';
                }
            } catch (err) {
                document.getElementById('follow-btn').style.display = 'block';
            }
        }

        async function toggleFollow() {
            if (!currentUserDiscordId) {
                openDiscordLogin();
                return;
            }

            const btn = document.getElementById('follow-btn');
            const isFollowing = btn.classList.contains('following');

            try {
                if (isFollowing) {
                    // Unfollow
                    const { error } = await supabaseClient
                        .from('followers')
                        .delete()
                        .eq('seguidor_id', currentUserDiscordId)
                        .eq('seguindo_id', userIdParam);

                    if (error) throw error;
                    btn.classList.remove('following');
                    btn.innerHTML = '<i class="fas fa-plus"></i> Seguir';
                } else {
                    // Follow
                    const { error } = await supabaseClient
                        .from('followers')
                        .insert({
                            seguidor_id: currentUserDiscordId,
                            seguindo_id: userIdParam
                        });

                    if (error) throw error;
                    btn.classList.add('following');
                    btn.innerHTML = '<i class="fas fa-check"></i> Seguindo';

                    // Recarregar seguidores
                    carregarSeguidores(userIdParam);
                }
            } catch (err) {
                console.error('Erro ao alternar follow:', err);
                alert('Erro ao alterar status de seguimento');
            }
        }
    </script>
</body>
</html>
