<!-- Exemplo de teste da integração Supabase -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Supabase VEditor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0014 0%, #1a0a2e 50%, #2d0a47 100%);
            color: #fff;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(26, 10, 46, 0.8);
            border: 2px solid #9d4edd;
            border-radius: 15px;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #c77dff;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #c77dff;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #9d4edd;
            border-radius: 8px;
            background: rgba(157, 78, 221, 0.1);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #c77dff;
            box-shadow: 0 0 10px rgba(199, 125, 255, 0.3);
        }
        button {
            background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(157, 78, 221, 0.4);
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }
        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }
        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }
        .info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196F3;
            color: #2196F3;
        }
        .section {
            margin-bottom: 40px;
        }
        .section h2 {
            color: #c77dff;
            border-bottom: 2px solid #9d4edd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Teste de Integração Supabase</h1>

        <!-- Seção 1: Testar Conexão -->
        <div class="section">
            <h2>1️⃣ Testar Conexão</h2>
            <button onclick="testarConexao()">Verificar Conexão com Supabase</button>
            <div id="conexao-message"></div>
        </div>

        <!-- Seção 2: Adicionar Perfil -->
        <div class="section">
            <h2>2️⃣ Adicionar/Atualizar Perfil</h2>
            <div class="form-group">
                <label>ID Discord (ex: 123456789)</label>
                <input type="text" id="discord-id" placeholder="Seu ID do Discord">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Seu nome de usuário">
            </div>
            <div class="form-group">
                <label>URL Avatar</label>
                <input type="text" id="avatar-url" placeholder="URL completa do avatar">
            </div>
            <button onclick="adicionarPerfil()">Salvar Perfil</button>
            <div id="perfil-message"></div>
        </div>

        <!-- Seção 3: Adicionar Produto -->
        <div class="section">
            <h2>3️⃣ Adicionar Produto Comprado</h2>
            <div class="form-group">
                <label>ID Discord do Usuário</label>
                <input type="text" id="produto-discord-id" placeholder="ID Discord do comprador">
            </div>
            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" id="produto-nome" placeholder="Ex: Comissão Full Body">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="produto-descricao" placeholder="Descrição do produto" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Link Download</label>
                <input type="text" id="produto-link" placeholder="URL do arquivo para download">
            </div>
            <button onclick="adicionarProduto()">Salvar Produto</button>
            <div id="produto-message"></div>
        </div>

        <!-- Seção 4: Consultar Dados -->
        <div class="section">
            <h2>4️⃣ Consultar Dados</h2>
            <div class="form-group">
                <label>ID Discord para Buscar Produtos</label>
                <input type="text" id="buscar-discord-id" placeholder="ID Discord">
            </div>
            <button onclick="buscarProdutos()">Buscar Produtos do Usuário</button>
            <div id="busca-message"></div>
        </div>

        <!-- Seção 5: Listar Todos -->
        <div class="section">
            <h2>5️⃣ Listar Dados</h2>
            <button onclick="listarPerfis()">Listar Todos os Perfis</button>
            <div id="perfis-list"></div>
            <button onclick="listarProdutos()" style="margin-top: 10px;">Listar Todos os Produtos</button>
            <div id="produtos-list"></div>
        </div>
    </div>

    <script>
        // Usar supabase.createClient() ao invés de window.supabase.createClient()
        const SUPABASE_URL = 'https://knbloqfdvlioxxkxthif.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuYmxvcWZkdmxpb3h4a3h0aGlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTIxNTMsImV4cCI6MjA5NDcyODE1M30.wDdPtUEBv8I00j0t-mlmdp3GDEcCZyRe1_BacNsQoCU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testarConexao() {
            const msg = document.getElementById('conexao-message');
            try {
                const { data, error } = await supabase.from('perfis').select('count()', { count: 'exact', head: true });
                if (error) throw error;
                msg.innerHTML = '<div class="message success">✅ Conectado com sucesso ao Supabase!</div>';
            } catch (err) {
                msg.innerHTML = `<div class="message error">❌ Erro: ${err.message}</div>`;
            }
        }

        async function adicionarPerfil() {
            const discordId = document.getElementById('discord-id').value;
            const username = document.getElementById('username').value;
            const avatarUrl = document.getElementById('avatar-url').value;
            const msg = document.getElementById('perfil-message');

            if (!discordId || !username || !avatarUrl) {
                msg.innerHTML = '<div class="message error">❌ Preencha todos os campos!</div>';
                return;
            }

            try {
                const { data, error } = await supabase.from('perfis').upsert({
                    id_discord: discordId,
                    username: username,
                    avatar_url: avatarUrl
                });
                
                if (error) throw error;
                msg.innerHTML = '<div class="message success">✅ Perfil salvo com sucesso!</div>';
                document.getElementById('discord-id').value = '';
                document.getElementById('username').value = '';
                document.getElementById('avatar-url').value = '';
            } catch (err) {
                msg.innerHTML = `<div class="message error">❌ Erro: ${err.message}</div>`;
            }
        }

        async function adicionarProduto() {
            const discordId = document.getElementById('produto-discord-id').value;
            const nome = document.getElementById('produto-nome').value;
            const descricao = document.getElementById('produto-descricao').value;
            const link = document.getElementById('produto-link').value;
            const msg = document.getElementById('produto-message');

            if (!discordId || !nome || !link) {
                msg.innerHTML = '<div class="message error">❌ Preencha Discord ID, Nome e Link!</div>';
                return;
            }

            try {
                const { data, error } = await supabase.from('produtos_usuarios').insert({
                    id_usuario_discord: discordId,
                    nome_produto: nome,
                    descricao: descricao,
                    link_download: link
                });
                
                if (error) throw error;
                msg.innerHTML = '<div class="message success">✅ Produto adicionado com sucesso!</div>';
                document.getElementById('produto-discord-id').value = '';
                document.getElementById('produto-nome').value = '';
                document.getElementById('produto-descricao').value = '';
                document.getElementById('produto-link').value = '';
            } catch (err) {
                msg.innerHTML = `<div class="message error">❌ Erro: ${err.message}</div>`;
            }
        }

        async function buscarProdutos() {
            const discordId = document.getElementById('buscar-discord-id').value;
            const msg = document.getElementById('busca-message');

            if (!discordId) {
                msg.innerHTML = '<div class="message error">❌ Digite um ID Discord!</div>';
                return;
            }

            try {
                const { data: produtos, error } = await supabase
                    .from('produtos_usuarios')
                    .select('*')
                    .eq('id_usuario_discord', discordId);
                
                if (error) throw error;

                if (!produtos || produtos.length === 0) {
                    msg.innerHTML = '<div class="message info">ℹ️ Nenhum produto encontrado para este usuário.</div>';
                } else {
                    let html = `<div class="message success">✅ ${produtos.length} produto(s) encontrado(s):</div>`;
                    html += '<div style="margin-top: 15px; text-align: left;">';
                    produtos.forEach(prod => {
                        html += `<div style="background: rgba(157, 78, 221, 0.1); padding: 10px; margin: 10px 0; border-radius: 5px;">
                            <strong>${prod.nome_produto}</strong><br>
                            ${prod.descricao ? `Descrição: ${prod.descricao}<br>` : ''}
                            <a href="${prod.link_download}" style="color: #c77dff;">📥 Download</a>
                        </div>`;
                    });
                    html += '</div>';
                    msg.innerHTML = html;
                }
            } catch (err) {
                msg.innerHTML = `<div class="message error">❌ Erro: ${err.message}</div>`;
            }
        }

        async function listarPerfis() {
            const container = document.getElementById('perfis-list');
            try {
                const { data: perfis, error } = await supabase.from('perfis').select('*');
                if (error) throw error;

                if (!perfis || perfis.length === 0) {
                    container.innerHTML = '<div class="message info">ℹ️ Nenhum perfil cadastrado.</div>';
                } else {
                    let html = `<div class="message success">✅ ${perfis.length} perfil(s) encontrado(s):</div>`;
                    html += '<div style="margin-top: 15px;">';
                    perfis.forEach(p => {
                        html += `<div style="background: rgba(157, 78, 221, 0.1); padding: 10px; margin: 10px 0; border-radius: 5px; text-align: left;">
                            <strong>@${p.username}</strong> (ID: ${p.id_discord})<br>
                            <small>Criado: ${new Date(p.created_at).toLocaleDateString('pt-BR')}</small>
                        </div>`;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                }
            } catch (err) {
                container.innerHTML = `<div class="message error">❌ Erro: ${err.message}</div>`;
            }
        }

        async function listarProdutos() {
            const container = document.getElementById('produtos-list');
            try {
                const { data: produtos, error } = await supabase.from('produtos_usuarios').select('*');
                if (error) throw error;

                if (!produtos || produtos.length === 0) {
                    container.innerHTML = '<div class="message info">ℹ️ Nenhum produto cadastrado.</div>';
                } else {
                    let html = `<div class="message success">✅ ${produtos.length} produto(s) encontrado(s):</div>`;
                    html += '<div style="margin-top: 15px; text-align: left;">';
                    produtos.forEach(p => {
                        html += `<div style="background: rgba(157, 78, 221, 0.1); padding: 10px; margin: 10px 0; border-radius: 5px;">
                            <strong>${p.nome_produto}</strong> (Usuário: ${p.id_usuario_discord})<br>
                            ${p.descricao ? `Descrição: ${p.descricao}<br>` : ''}
                            <a href="${p.link_download}" style="color: #c77dff;">📥 Download</a><br>
                            <small>Comprado em: ${new Date(p.data_compra).toLocaleDateString('pt-BR')}</small>
                        </div>`;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                }
            } catch (err) {
                container.innerHTML = `<div class="message error">❌ Erro: ${err.message}</div>`;
            }
        }

        // Testar conexão automaticamente ao carregar
        window.addEventListener('load', () => {
            testarConexao();
        });
    </script>
</body>
</html>
